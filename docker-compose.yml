services:
  postgres:
    image: postgres:17
    container_name: minierp-postgres
    environment:
      POSTGRES_DB: minierp
      POSTGRES_USER: minierp
      POSTGRES_PASSWORD: minierp
    ports:
      - "5432:5432"
    volumes:
      - minierp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minierp -d minierp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minierp-pgdata:
